name: Publish Lichen Vivarium II to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - studio-runtime.js
      - geometry-layer.js
      - branch-skeletons.js
      - rhizine-network.js
      - substrate-ecology.js
      - tests/substrate-ecology.test.cjs
      - tests/branch-skeletons.test.cjs
      - tests/geometry-layer.test.cjs
      - studio-layout.css
      - palette-library.js
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
      - name: Check biological 3D geometry and cortical material regression (no dependencies)
        run: node --test tests/*.test.cjs
      - name: Prepare static site (no npm build or paid host)
        run: |
          mkdir -p _site
          cp index.html studio-runtime.js geometry-layer.js branch-skeletons.js rhizine-network.js substrate-ecology.js studio-layout.css palette-library.js _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
